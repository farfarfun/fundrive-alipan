[project]
name = "fundrive-alipan"
version = "2.0.91"
description = "fundrive-alipan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "funget>=1.1.63", "funfile>=1.0.39", "funsecret>=1.4.84", "farlog>=1.1.7", "farcache>=2.0.3", "qrcode>=7.4.2", "requests>=2.32.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun-drive"
Repository = "https://github.com/farfarfun-drive/fundrive-alipan"
Releases = "https://github.com/farfarfun-drive/fundrive-alipan/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"      # 与 requires-python = ">=3.12" 对齐
src = ["src", "tests"]

[tool.ruff.lint]
# 显式固定规则集。不写 select 就吃 ruff 的默认值，而默认值会随 ruff 升级变宽 ——
# 那样 CI 的红绿取决于当天装到哪个 ruff 版本，而不是代码改了什么。
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14.0"]
