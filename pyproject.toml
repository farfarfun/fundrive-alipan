[project]
name = "fundrive-alipan"
version = "2.0.91"
description = "fundrive-alipan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "funget>=1.1.63", "funfile>=1.0.39", "funsecret>=1.4.84", "farlog>=1.1.7", "farcache>=2.0.3", "qrcode>=7.4.2", "requests>=2.32.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fundrive-alipan"
Releases = "https://github.com/farfarfun/fundrive-alipan/releases"

[tool.setuptools]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=7.0"]
